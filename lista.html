<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - OS System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <h2>OS System</h2>
        <nav>
            <a href="dashboard.html"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span><span>Painel</span></a>
            <a href="cadastros.html"><span class="nav-icon"><i class="fa-solid fa-file-circle-plus"></i></span><span>Novo serviço</span></a>
            <a href="lista.html" class="ativo"><span class="nav-icon"><i class="fa-solid fa-list-check"></i></span><span>Serviços</span></a>
            <a href="tecnicos.html"><span class="nav-icon"><i class="fa-solid fa-user-gear"></i></span><span>Técnicos</span></a>
            <a href="clientes.html"><span class="nav-icon"><i class="fa-solid fa-user"></i></span><span>Clientes</span></a>
        </nav>
    </header>

    <main>
        <div class="topo">
            <div>
                <h1>Serviços</h1>
                <p>Veja os serviços cadastrados.</p>
            </div>
            <a href="cadastros.html" class="botao">+ Novo serviço</a>
        </div>

        <input id="pesquisa-ordens" class="pesquisa" type="text" placeholder="Buscar serviço...">

        <section class="box tabela">
            <table>
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Cliente</th>
                        <th>Técnico</th>
                        <th>Urgência</th>
                        <th>Situação</th>
                        <th>Ver</th>
                    </tr>
                </thead>
                <tbody id="lista-ordens"></tbody>
            </table>
        </section>
    </main>

    <script>
        // se não estiver logado volta pro login
        if (sessionStorage.getItem('osSystemAuth') !== 'true') {
            window.location.href = 'index.html';
        }

        const tabela = document.getElementById('lista-ordens');
        const pesquisa = document.getElementById('pesquisa-ordens');

        function classeStatus(status) {
            if (status === 'Em execução') return 'andamento';
            if (status === 'Concluída') return 'concluida';
            if (status === 'Cancelada') return 'cancelada';
            return 'aberta';
        }

        function mostrarOrdens() {
            const ordens = JSON.parse(localStorage.getItem('ordens')) || [];
            const termo = pesquisa.value.toLowerCase();
            let linhas = '';

            for (let i = 0; i < ordens.length; i++) {
                const o = ordens[i];

                // filtro da pesquisa
                const texto = (o.cliente + ' ' + o.tecnico + ' ' + o.equipamento + ' ' + o.prioridade + ' ' + o.status).toLowerCase();
                if (!texto.includes(termo)) {
                    continue;
                }

                // ordem concluída ou cancelada não abre mais
                let acao = '<a href="detalhes.html?id=' + o.id + '">Abrir</a>';
                if (o.status === 'Concluída' || o.status === 'Cancelada') {
                    acao = '<span class="acao-fechada">Finalizada</span>';
                }

                linhas += `
                    <tr>
                        <td>#${String(o.id).padStart(3, '0')}</td>
                        <td>${o.cliente}</td>
                        <td>${o.tecnico}</td>
                        <td>${o.prioridade}</td>
                        <td><span class="status ${classeStatus(o.status)}">${o.status}</span></td>
                        <td>${acao}</td>
                    </tr>`;
            }

            if (linhas === '') {
                linhas = '<tr><td colspan="6" class="lista-vazia">Nenhum serviço encontrado.</td></tr>';
            }

            tabela.innerHTML = linhas;
        }

        pesquisa.addEventListener('input', mostrarOrdens);
        mostrarOrdens();
    </script>

</body>
</html>
