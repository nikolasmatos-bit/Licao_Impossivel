<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - Megabrain Services</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/api.js"></script>
    <script src="./js/auth.js" defer></script>
</head>
<body>
        <header>
        <h2>Megabrain Services</h2>
        <nav class="menu">
            <a href="dashboard.html">Painel</a>
            <a href="cadastros.html">Nova OS</a>
            <a href="lista.html">Ordens</a>
            <a href="tecnicos.html">Tecnicos</a>
            <a href="clientes.html">Clientes</a>
        </nav>
    </header>

    <main>
        <div class="topo">
            <div>
                <h1>Serviços</h1>
                <p>Veja os serviços cadastrados no banco de dados.</p>
            </div>
            <a class="button button-primary" href="cadastros.html"> Nova ordem</a>
        </div>

        <div class="list-toolbar">
            <label class="search-field"><input id="pesquisa-ordens" type="search" placeholder="Cliente, técnico, telefone ou equipamento" aria-label="Buscar ordens"></label>
            <div class="filter-row" id="filtros-status" aria-label="Filtrar por status">
                <button type="button" class="filter-chip is-active" data-status="Todas" aria-pressed="true">Todas</button>
                <button type="button" class="filter-chip" data-status="Aberta" aria-pressed="false">Abertas</button>
                <button type="button" class="filter-chip" data-status="Em execução" aria-pressed="false">Em execução</button>
                <button type="button" class="filter-chip" data-status="Concluída" aria-pressed="false">Concluídas</button>
                <button type="button" class="filter-chip" data-status="Cancelada" aria-pressed="false">Canceladas</button>
            </div>
        </div>

        <section class="data-section">
            <div class="section-heading"><div><h2>Ordens de serviço</h2><p id="resultado-ordens">Carregando ordens...</p></div></div>
            <div class="table-wrap"><table>
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Cliente</th>
                        <th>Técnico</th>
                        <th>Urgência</th>
                        <th>Situação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-ordens"></tbody>
            </table></div>
            <div class="empty-state" id="vazio-ordens" hidden><strong>Nenhuma ordem encontrada</strong><span>Ajuste os filtros ou cadastre uma nova OS.</span></div>
        </section>
    </main>

    <script>
        const tabela = document.getElementById('lista-ordens');
        const pesquisa = document.getElementById('pesquisa-ordens');
        const chips = [...document.querySelectorAll('[data-status]')];
        const parametros = new URLSearchParams(window.location.search);
        pesquisa.value = parametros.get('cliente') || '';
        let todasOrdens = [];
        let statusSelecionado = parametros.get('status') || 'Todas';
        if (!chips.some(chip => chip.dataset.status === statusSelecionado)) statusSelecionado = 'Todas';

        function classeStatus(status) {
            if (status === 'Em execução') return 'andamento';
            if (status === 'Concluída') return 'concluida';
            if (status === 'Cancelada') return 'cancelada';
            return 'aberta';
        }

        function renderizar() {
            const termo = pesquisa.value.trim().toLocaleLowerCase('pt-BR');
            let linhas = '';
            let quantidade = 0;

            for (let i = 0; i < todasOrdens.length; i++) {
                const o = todasOrdens[i];
                const texto = [o.cliente, o.cliente_telefone, o.cliente_email, o.tecnico, o.equipamento, o.prioridade, o.status].join(' ').toLocaleLowerCase('pt-BR');
                if (!texto.includes(termo)) continue;
                if (statusSelecionado !== 'Todas' && o.status !== statusSelecionado) continue;
                quantidade++;

                let acao = '<a class="icon-action" href="detalhes.html?id=' + o.id + '">Abrir</a>';
                if (o.status === 'Concluída' || o.status === 'Cancelada') {
                    acao += '<span class="acao-fechada">Finalizada</span>';
                }

                linhas += `
                    <tr>
                        <td>#${String(o.id).padStart(3, '0')}</td>
                        <td><a class="customer-link" href="clientes.html">${escapar(o.cliente)}</a></td>
                        <td>${escapar(o.tecnico || '—')}</td>
                        <td>${escapar(o.prioridade)}</td>
                        <td><span class="status ${classeStatus(o.status)}">${escapar(o.status)}</span></td>
                        <td class="row-actions">${acao}<button class="icon-action copiar-link" type="button" data-os="${o.id}">Copiar link</button></td>
                    </tr>`;
            }

            tabela.innerHTML = linhas;
            document.getElementById('vazio-ordens').hidden = quantidade > 0;
            document.getElementById('resultado-ordens').textContent = `${quantidade} de ${todasOrdens.length} ordens`;
            chips.forEach(chip => {
                const ativo = chip.dataset.status === statusSelecionado;
                chip.classList.toggle('is-active', ativo);
                chip.setAttribute('aria-pressed', String(ativo));
            });
        }

        function escapar(valor) {
            return String(valor || '').replace(/[&<>"']/g, caractere => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[caractere]);
        }

        apiFetch('/api/ordens')
            .then(r => r.json())
            .then(dados => {
                todasOrdens = dados;
                renderizar();
            })
            .catch(() => {
                tabela.innerHTML = '<tr><td colspan="6" class="lista-vazia">Erro ao conectar no servidor. O Node está rodando?</td></tr>';
            });

        pesquisa.addEventListener('input', renderizar);
        chips.forEach(chip => chip.addEventListener('click', () => {
            statusSelecionado = chip.dataset.status;
            renderizar();
        }));
        tabela.addEventListener('click', async event => {
            const botao = event.target.closest('.copiar-link');
            if (!botao) return;
            try {
                await navigator.clipboard.writeText(`${location.origin}/detalhes.html?id=${botao.dataset.os}`);
                botao.textContent = 'Copiado';
                setTimeout(() => { botao.textContent = 'Copiar link'; }, 1400);
            } catch {
                alert('Não foi possível copiar o link neste navegador.');
            }
        });
    </script>
</body>
</html>
