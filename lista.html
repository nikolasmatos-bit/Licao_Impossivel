<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ordens de Serviço - OS System</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>

        <h2>OS System</h2>

        <nav>
            <a href="dashboard.html"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span><span>Dashboard</span></a>
            <a href="cadastros.html"><span class="nav-icon"><i class="fa-solid fa-file-circle-plus"></i></span><span>Nova OS</span></a>
            <a href="lista.html" class="ativo"><span class="nav-icon"><i class="fa-solid fa-list-check"></i></span><span>Ordens</span></a>
            <a href="tecnicos.html"><span class="nav-icon"><i class="fa-solid fa-user-gear"></i></span><span>Técnicos</span></a>
            <a href="clientes.html"><span class="nav-icon"><i class="fa-solid fa-user"></i></span><span>Cliente</span></a>
        </nav>

    </header>


    <main>

        <div class="topo">

            <div>

                <h1>Ordens de Serviço</h1>

                <p>
                    Consulte as ordens cadastradas.
                </p>

            </div>

            <a href="cadastros.html" class="botao">
                + Nova OS
            </a>

        </div>


        <input
            id="pesquisa-ordens"
            class="pesquisa"
            type="text"
            placeholder="Pesquisar ordem de serviço..."
        >


        <section class="box tabela">

            <table>

                <thead>
                    <tr>

                        <th>OS</th>
                        <th>Cliente</th>
                        <th>Técnico</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Ação</th>

                    </tr>
                </thead>

                <tbody id="lista-ordens"></tbody>

            </table>

        </section>

    </main>

    <script>
        const authStatus = sessionStorage.getItem('osSystemAuth');
        if (authStatus !== 'true') {
            window.location.href = 'index.html';
        }

        const listaOrdens = document.getElementById('lista-ordens');
        const pesquisa = document.getElementById('pesquisa-ordens');

        function escapeHtml(value = '') {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function safeParse(key, fallback) {
            try {
                const valor = JSON.parse(localStorage.getItem(key) || 'null');
                return valor ?? fallback;
            } catch (erro) {
                return fallback;
            }
        }

        function statusClass(status) {
            if (status === 'Em execução') return 'andamento';
            if (status === 'Concluída') return 'concluida';
            if (status === 'Cancelada') return 'cancelada';
            return 'aberta';
        }

        function renderOrdens() {
            const ordens = safeParse('ordens', []);
            const termo = (pesquisa ? pesquisa.value : '').trim().toLowerCase();

            const ordensFiltradas = !termo
                ? ordens
                : ordens.filter((ordem) => {
                    const texto = `${ordem.cliente} ${ordem.tecnico} ${ordem.equipamento} ${ordem.prioridade} ${ordem.status}`.toLowerCase();
                    return texto.includes(termo);
                });

            if (!ordensFiltradas.length) {
                listaOrdens.innerHTML = `
                    <tr>
                        <td colspan="6" class="lista-vazia">Nenhuma ordem cadastrada ou encontrada.</td>
                    </tr>
                `;
                return;
            }

            listaOrdens.innerHTML = ordensFiltradas.map((ordem) => {
                const statusFinal = ['Concluída', 'Cancelada'].includes(ordem.status);
                const linkVisualizacao = statusFinal
                    ? '<span class="acao-fechada">Encerrada</span>'
                    : `<a href="detalhes.html?id=${ordem.id}">Visualizar</a>`;

                return `
                    <tr>
                        <td>#${String(ordem.id).padStart(3, '0')}</td>
                        <td>${escapeHtml(ordem.cliente)}</td>
                        <td>${escapeHtml(ordem.tecnico)}</td>
                        <td>${escapeHtml(ordem.prioridade)}</td>
                        <td>
                            <span class="status ${statusClass(ordem.status)}">
                                ${escapeHtml(ordem.status)}
                            </span>
                        </td>
                        <td>
                            ${linkVisualizacao}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        if (pesquisa) {
            pesquisa.addEventListener('input', renderOrdens);
        }

        renderOrdens();
    </script>

</body>

</html>
