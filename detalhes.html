<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da OS - OS System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <h2>OS System</h2>
        <nav>
            <a href="dashboard.html"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span><span>Dashboard</span></a>
            <a href="cadastros.html"><span class="nav-icon"><i class="fa-solid fa-file-circle-plus"></i></span><span>Nova OS</span></a>
            <a href="lista.html"><span class="nav-icon"><i class="fa-solid fa-list-check"></i></span><span>Ordens</span></a>
            <a href="tecnicos.html"><span class="nav-icon"><i class="fa-solid fa-user-gear"></i></span><span>Técnicos</span></a>
            <a href="clientes.html"><span class="nav-icon"><i class="fa-solid fa-user"></i></span><span>Cliente</span></a>
        </nav>
    </header>

    <main>

        <!-- janela de confirmação -->
        <div id="modal-confirmacao" class="modal-confirmacao hidden">
            <div class="modal-box">
                <h3 id="titulo-modal">Confirmar ação</h3>
                <p id="texto-modal">Deseja realmente continuar?</p>
                <div class="modal-actions">
                    <button type="button" id="confirmar-acoes-modal" class="botao-primary">Confirmar</button>
                    <button type="button" id="cancelar-acoes-modal" class="botao-cancelar">Cancelar</button>
                </div>
            </div>
        </div>

        <div class="topo">
            <div>
                <h1 id="titulo-os">OS #000</h1>
                <p>Detalhes da ordem de serviço</p>
            </div>
            <span id="status-os" class="status aberta">Aberta</span>
        </div>

        <section class="box">
            <h2>Informações da OS</h2>
            <div class="informacoes">
                <div>
                    <strong>Cliente</strong>
                    <p id="cliente-os">-</p>
                </div>
                <div>
                    <strong>Técnico</strong>
                    <p id="tecnico-os">-</p>
                </div>
                <div>
                    <strong>Equipamento</strong>
                    <p id="equipamento-os">-</p>
                </div>
                <div>
                    <strong>Prioridade</strong>
                    <p id="prioridade-os">-</p>
                </div>
                <div>
                    <strong>Data de abertura</strong>
                    <p id="data-os">-</p>
                </div>
            </div>
        </section>

        <section class="box">
            <h2>Descrição do problema</h2>
            <p id="descricao-os">-</p>
        </section>

        <section class="box">
            <h2>Responder atendimento</h2>

            <form id="form-resposta">
                <label for="status">Status da OS</label>
                <select id="status">
                    <option value="Aberta">Aberta</option>
                    <option value="Em execução">Em execução</option>
                    <option value="Concluída">Concluída</option>
                    <option value="Cancelada">Cancelada</option>
                </select>

                <label for="diagnostico">Diagnóstico / Resposta</label>
                <textarea id="diagnostico" placeholder="Descreva o diagnóstico, solução ou resposta do atendimento..." required></textarea>

                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button type="submit">Salvar resposta</button>
                    <button type="button" id="concluir-atendimento" class="botao-secundario">Concluir atendimento</button>
                    <button type="button" id="cancelar-servico" class="botao-cancelar">Cancelar serviço</button>
                </div>

                <div id="mensagem-resposta" class="mensagem"></div>
            </form>
        </section>

    </main>

    <script>
        // se não estiver logado volta pro login
        if (sessionStorage.getItem('osSystemAuth') !== 'true') {
            window.location.href = 'index.html';
        }

        // pega o id que veio na url (detalhes.html?id=1)
        const id = Number(new URLSearchParams(window.location.search).get('id'));
        const ordens = JSON.parse(localStorage.getItem('ordens')) || [];
        const ordem = ordens.find(function (item) {
            return item.id === id;
        });

        let acao = ''; // 'concluir' ou 'cancelar'

        function classeStatus(status) {
            if (status === 'Em execução') return 'andamento';
            if (status === 'Concluída') return 'concluida';
            if (status === 'Cancelada') return 'cancelada';
            return 'aberta';
        }

        // trava os campos quando a ordem já foi encerrada
        function travarSeEncerrada() {
            const encerrada = ordem.status === 'Concluída' || ordem.status === 'Cancelada';

            document.getElementById('diagnostico').disabled = encerrada;
            document.getElementById('status').disabled = encerrada;
            document.getElementById('concluir-atendimento').disabled = encerrada;
            document.getElementById('cancelar-servico').disabled = encerrada;
        }

        function mostrarDados() {
            if (!ordem) {
                document.getElementById('titulo-os').textContent = 'OS não encontrada';
                document.getElementById('descricao-os').textContent = 'Volte para a lista e escolha uma ordem válida.';
                return;
            }

            document.getElementById('titulo-os').textContent = 'OS #' + String(ordem.id).padStart(3, '0');
            document.getElementById('cliente-os').textContent = ordem.cliente;
            document.getElementById('tecnico-os').textContent = ordem.tecnico;
            document.getElementById('equipamento-os').textContent = ordem.equipamento;
            document.getElementById('prioridade-os').textContent = ordem.prioridade;
            document.getElementById('data-os').textContent = ordem.data || '-';
            document.getElementById('descricao-os').textContent = ordem.descricao;

            document.getElementById('status-os').textContent = ordem.status;
            document.getElementById('status-os').className = 'status ' + classeStatus(ordem.status);

            document.getElementById('status').value = ordem.status;
            document.getElementById('diagnostico').value = ordem.diagnostico || '';

            travarSeEncerrada();
        }

        function salvar(status, diagnostico) {
            ordem.status = status;
            ordem.diagnostico = diagnostico;
            localStorage.setItem('ordens', JSON.stringify(ordens));

            mostrarDados();

            const mensagem = document.getElementById('mensagem-resposta');
            mensagem.className = 'mensagem sucesso';
            mensagem.textContent = 'Resposta salva com sucesso!';
        }

        function abrirModal(tipo) {
            acao = tipo;

            if (tipo === 'concluir') {
                document.getElementById('titulo-modal').textContent = 'Concluir atendimento';
            } else {
                document.getElementById('titulo-modal').textContent = 'Cancelar serviço';
            }

            document.getElementById('texto-modal').textContent = 'Depois disso a ordem será encerrada e não poderá mais ser alterada. Deseja confirmar?';
            document.getElementById('modal-confirmacao').classList.remove('hidden');
        }

        function fecharModal() {
            acao = '';
            document.getElementById('modal-confirmacao').classList.add('hidden');
        }

        document.getElementById('form-resposta').addEventListener('submit', function (event) {
            event.preventDefault();

            if (!ordem) return;

            salvar(document.getElementById('status').value, document.getElementById('diagnostico').value.trim());
        });

        document.getElementById('concluir-atendimento').addEventListener('click', function () {
            if (ordem) abrirModal('concluir');
        });

        document.getElementById('cancelar-servico').addEventListener('click', function () {
            if (ordem) abrirModal('cancelar');
        });

        document.getElementById('confirmar-acoes-modal').addEventListener('click', function () {
            let diagnostico = document.getElementById('diagnostico').value.trim();

            if (acao === 'concluir') {
                salvar('Concluída', diagnostico || 'Atendimento concluído com sucesso.');
            } else {
                salvar('Cancelada', diagnostico || 'Serviço cancelado.');
            }

            fecharModal();
        });

        document.getElementById('cancelar-acoes-modal').addEventListener('click', fecharModal);

        mostrarDados();
    </script>

</body>
</html>
