<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - OS System</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>

        <h2>OS System</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="cadastros.html">Nova OS</a>
            <a href="lista.html">Ordens</a>
            <a href="tecnicos.html">Técnicos</a>
            <a href="clientes.html">Cliente</a>
        </nav>

    </header>


    <main>

        <h1>Dashboard</h1>

        <p>Visão geral do sistema</p>


        <section class="cards">

            <div class="card">
                <h3>Total de OS</h3>
                <strong>25</strong>
            </div>

            <div class="card">
                <h3>OS Abertas</h3>
                <strong>08</strong>
            </div>

            <div class="card">
                <h3>Em execução</h3>
                <strong>10</strong>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <strong>07</strong>
            </div>

        </section>


        <section class="box">

            <h2>Ordens recentes</h2>

            <table>

                <tr>
                    <th>OS</th>
                    <th>Cliente</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>#001</td>
                    <td>João Silva</td>
                    <td>
                        <span class="status andamento">
                            Em execução
                        </span>
                    </td>
                </tr>

                <tr>
                    <td>#002</td>
                    <td>Maria Souza</td>
                    <td>
                        <span class="status aberta">
                            Aberta
                        </span>
                    </td>
                </tr>

                <tr>
                    <td>#003</td>
                    <td>Pedro Santos</td>
                    <td>
                        <span class="status concluida">
                            Concluída
                        </span>
                    </td>
                </tr>

            </table>

        </section>

    </main>

</body>

</html>
