<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo - OS System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <h2>OS System</h2>
        <nav>
            <a href="dashboard.html" class="ativo"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span><span>Painel</span></a>
            <a href="cadastros.html"><span class="nav-icon"><i class="fa-solid fa-file-circle-plus"></i></span><span>Novo serviço</span></a>
            <a href="lista.html"><span class="nav-icon"><i class="fa-solid fa-list-check"></i></span><span>Serviços</span></a>
            <a href="tecnicos.html"><span class="nav-icon"><i class="fa-solid fa-user-gear"></i></span><span>Técnicos</span></a>
            <a href="clientes.html"><span class="nav-icon"><i class="fa-solid fa-user"></i></span><span>Clientes</span></a>
        </nav>
    </header>

    <main>
        <h1>Resumo</h1>
        <p>Veja os serviços cadastrados.</p>

        <section class="cards">
            <div class="card">
                <h3>Total de serviços</h3>
                <strong>12</strong>
            </div>
            <div class="card">
                <h3>Serviços abertos</h3>
                <strong>4</strong>
            </div>
            <div class="card">
                <h3>Em execução</h3>
                <strong>3</strong>
            </div>
            <div class="card">
                <h3>Prontos</h3>
                <strong>5</strong>
            </div>
        </section>

        <section class="box">
            <h2>Últimos serviços</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Cliente</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#012</td>
                        <td>Ana Souza</td>
                        <td><span class="status aberta">Aberta</span></td>
                    </tr>
                    <tr>
                        <td>#011</td>
                        <td>Bruno Lima</td>
                        <td><span class="status andamento">Em execução</span></td>
                    </tr>
                    <tr>
                        <td>#010</td>
                        <td>Carla Mendes</td>
                        <td><span class="status concluida">Concluída</span></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        // se não estiver logado volta pro login
        if (sessionStorage.getItem('osSystemAuth') !== 'true') {
            window.location.href = 'index.html';
        }

    </script>

</body>
</html>
