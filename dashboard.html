<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - OS System</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <h2>OS System</h2>
        <nav>
            <a href="dashboard.html" class="ativo">Dashboard</a>
            <a href="cadastros.html">Nova OS</a>
            <a href="lista.html">Ordens</a>
            <a href="tecnicos.html">Técnicos</a>
            <a href="clientes.html">Cliente</a>
        </nav>
    </header>

    <main>
        <h1>Dashboard</h1>
        <p>Visão geral do sistema · Dados vindos do banco de dados</p>

        <section class="cards">
            <div class="card">
                <h3>Total de OS</h3>
                <strong id="total-os">0</strong>
            </div>
            <div class="card">
                <h3>OS Abertas</h3>
                <strong id="os-abertas">0</strong>
            </div>
            <div class="card">
                <h3>Em execução</h3>
                <strong id="em-execucao">0</strong>
            </div>
            <div class="card">
                <h3>Concluídas</h3>
                <strong id="concluidas">0</strong>
            </div>
        </section>

        <section class="box">
            <h2>Ordens recentes</h2>
            <table>
                <thead>
                    <tr>
                        <th>OS</th>
                        <th>Cliente</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="ordens-recentes"></tbody>
            </table>
        </section>
    </main>

    <script>
        if (sessionStorage.getItem('osSystemAuth') !== 'true') {
            window.location.href = 'index.html';
        }

        function classeStatus(status) {
            if (status === 'Em execução') return 'andamento';
            if (status === 'Concluída') return 'concluida';
            if (status === 'Cancelada') return 'cancelada';
            return 'aberta';
        }

        // Buscar contadores
        fetch('http://localhost:3000/api/dashboard')
            .then(r => r.json())
            .then(d => {
                document.getElementById('total-os').textContent = d.total_os || 0;
                document.getElementById('os-abertas').textContent = d.os_abertas || 0;
                document.getElementById('em-execucao').textContent = d.em_execucao || 0;
                document.getElementById('concluidas').textContent = d.concluidas || 0;
            })
            .catch(() => console.warn('Erro no dashboard'));

        // Buscar ordens recentes
        fetch('http://localhost:3000/api/ordens')
            .then(r => r.json())
            .then(ordens => {
                const tbody = document.getElementById('ordens-recentes');
                const recentes = ordens.slice(0, 3);
                let html = '';

                recentes.forEach(o => {
                    html += `
                        <tr>
                            <td>#${String(o.id).padStart(3, '0')}</td>
                            <td>${o.cliente}</td>
                            <td><span class="status ${classeStatus(o.status)}">${o.status}</span></td>
                        </tr>`;
                });

                if (html === '') {
                    html = '<tr><td colspan="3" class="lista-vazia">Nenhuma OS cadastrada.</td></tr>';
                }
                tbody.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('ordens-recentes').innerHTML =
                    '<tr><td colspan="3" class="lista-vazia">Erro ao conectar no servidor.</td></tr>';
            });
    </script>

</body>
</html>
