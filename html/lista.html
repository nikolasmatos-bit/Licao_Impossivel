<!DOCTYPE html>
<!-- Elemento raiz do documento e idioma usado. -->
<html lang="pt-br">
<!-- Agrupa as configurações e recursos carregados antes do corpo. -->
<head>
    <meta charset="UTF-8">
    <!-- Configuração técnica da página. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Texto que aparece na aba do navegador. -->
    <title>Serviços - Megabrain Services</title>
    <!-- Importa um arquivo CSS para estilizar a página; carrega/aponta para "./css/base.css". -->
    <link rel="stylesheet" href="./css/base.css">
    <!-- Importa um arquivo CSS para estilizar a página; carrega/aponta para "./css/lista.css". -->
    <link rel="stylesheet" href="./css/lista.css">
    <!-- Carrega JavaScript responsável pelo comportamento da tela; carrega/aponta para "./js/api.js". -->
    <script src="./js/api.js"></script>
    <!-- Carrega JavaScript responsável pelo comportamento da tela; carrega/aponta para "./js/utils.js". -->
    <script src="./js/utils.js"></script>
    <!-- Carrega JavaScript responsável pelo comportamento da tela; carrega/aponta para "./js/auth.js"; defer adia a execução até o HTML ser analisado. -->
    <script src="./js/auth.js" defer></script>
<!-- Encerra o elemento head iniciado anteriormente. -->
</head>
<!-- Contém todo o conteúdo visível da página. -->
<body>
        <!-- Cabeçalho do sistema com identidade e navegação. -->
        <header>
        <!-- Título de seção. -->
        <h2>Megabrain Services</h2>
        <!-- Agrupa os links de navegação entre páginas; class associa estilos CSS. -->
        <nav class="menu">
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "dashboard.html". -->
            <a href="dashboard.html">Painel</a>
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "cadastros.html". -->
            <a href="cadastros.html">Nova OS</a>
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "lista.html". -->
            <a href="lista.html">Ordens</a>
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "tecnicos.html". -->
            <a href="tecnicos.html">Tecnicos</a>
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "clientes.html". -->
            <a href="clientes.html">Clientes</a>
        <!-- Encerra o elemento nav iniciado anteriormente. -->
        </nav>
    <!-- Encerra o elemento header iniciado anteriormente. -->
    </header>

    <!-- Marca a área principal da tela. -->
    <main>
        <!-- Agrupa elementos para organização e estilo; class associa estilos CSS. -->
        <div class="topo">
            <!-- Agrupa elementos para organização e estilo. -->
            <div>
                <!-- Título principal desta tela. -->
                <h1>Serviços</h1>
                <!-- Parágrafo de texto explicativo. -->
                <p>Veja os serviços cadastrados no banco de dados.</p>
            <!-- Encerra o elemento div iniciado anteriormente. -->
            </div>
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "cadastros.html"; class associa estilos CSS. -->
            <a class="button button-primary" href="cadastros.html"> Nova ordem</a>
        <!-- Encerra o elemento div iniciado anteriormente. -->
        </div>

        <!-- Agrupa elementos para organização e estilo; class associa estilos CSS. -->
        <div class="list-toolbar">
            <!-- Rótulo que identifica o campo do formulário; id="pesquisa-ordens" identifica o elemento para o JavaScript e o CSS; type="search" determina seu tipo; atributos aria-* ajudam tecnologias assistivas; class associa estilos CSS. -->
            <label class="search-field"><input id="pesquisa-ordens" type="search" placeholder="Cliente, técnico, telefone ou equipamento" aria-label="Buscar ordens"></label>
            <!-- Agrupa elementos para organização e estilo; id="filtros-status" identifica o elemento para o JavaScript e o CSS; atributos aria-* ajudam tecnologias assistivas; class associa estilos CSS. -->
            <div class="filter-row" id="filtros-status" aria-label="Filtrar por status">
                <!-- Botão de ação ou envio de formulário; type="button" determina seu tipo; atributos aria-* ajudam tecnologias assistivas; class associa estilos CSS. -->
                <button type="button" class="filter-chip is-active" data-status="Todas" aria-pressed="true">Todas</button>
                <!-- Botão de ação ou envio de formulário; type="button" determina seu tipo; atributos aria-* ajudam tecnologias assistivas; class associa estilos CSS. -->
                <button type="button" class="filter-chip" data-status="Aberta" aria-pressed="false">Abertas</button>
                <!-- Botão de ação ou envio de formulário; type="button" determina seu tipo; atributos aria-* ajudam tecnologias assistivas; class associa estilos CSS. -->
                <button type="button" class="filter-chip" data-status="Em execução" aria-pressed="false">Em execução</button>
                <!-- Botão de ação ou envio de formulário; type="button" determina seu tipo; atributos aria-* ajudam tecnologias assistivas; class associa estilos CSS. -->
                <button type="button" class="filter-chip" data-status="Concluída" aria-pressed="false">Concluídas</button>
                <!-- Botão de ação ou envio de formulário; type="button" determina seu tipo; atributos aria-* ajudam tecnologias assistivas; class associa estilos CSS. -->
                <button type="button" class="filter-chip" data-status="Cancelada" aria-pressed="false">Canceladas</button>
            <!-- Encerra o elemento div iniciado anteriormente. -->
            </div>
        <!-- Encerra o elemento div iniciado anteriormente. -->
        </div>

        <!-- Agrupa uma seção funcional do conteúdo; class associa estilos CSS. -->
        <section class="data-section">
            <!-- Agrupa elementos para organização e estilo; id="resultado-ordens" identifica o elemento para o JavaScript e o CSS; class associa estilos CSS. -->
            <div class="section-heading"><div><h2>Ordens de serviço</h2><p id="resultado-ordens">Carregando ordens...</p></div></div>
            <!-- Agrupa elementos para organização e estilo; class associa estilos CSS. -->
            <div class="table-wrap"><table>
                <!-- Cabeçalho da tabela. -->
                <thead>
                    <!-- Linha da tabela. -->
                    <tr>
                        <!-- Célula de título de coluna. -->
                        <th>Nº</th>
                        <!-- Célula de título de coluna. -->
                        <th>Cliente</th>
                        <!-- Célula de título de coluna. -->
                        <th>Técnico</th>
                        <!-- Célula de título de coluna. -->
                        <th>Urgência</th>
                        <!-- Célula de título de coluna. -->
                        <th>Situação</th>
                        <!-- Célula de título de coluna. -->
                        <th>Ações</th>
                    <!-- Encerra o elemento tr iniciado anteriormente. -->
                    </tr>
                <!-- Encerra o elemento thead iniciado anteriormente. -->
                </thead>
                <!-- Corpo com as linhas de dados da tabela; id="lista-ordens" identifica o elemento para o JavaScript e o CSS. -->
                <tbody id="lista-ordens"></tbody>
            <!-- Encerra o elemento table iniciado anteriormente. -->
            </table></div>
            <!-- Agrupa elementos para organização e estilo; id="vazio-ordens" identifica o elemento para o JavaScript e o CSS; hidden deixa o conteúdo inicialmente oculto; class associa estilos CSS. -->
            <div class="empty-state" id="vazio-ordens" hidden><strong>Nenhuma ordem encontrada</strong><span>Ajuste os filtros ou cadastre uma nova OS.</span></div>
        <!-- Encerra o elemento section iniciado anteriormente. -->
        </section>
    <!-- Encerra o elemento main iniciado anteriormente. -->
    </main>

    <!-- Carrega JavaScript responsável pelo comportamento da tela; carrega/aponta para "./js/lista.js". -->
    <script src="./js/lista.js"></script>
<!-- Encerra o elemento body iniciado anteriormente. -->
</body>
<!-- Encerra o elemento html iniciado anteriormente. -->
</html>
