<!DOCTYPE html>
<!-- Elemento raiz do documento e idioma usado. -->
<html lang="pt-br">
<!-- Agrupa as configurações e recursos carregados antes do corpo. -->
<head>
    <meta charset="UTF-8">
    <!-- Configuração técnica da página. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Texto que aparece na aba do navegador. -->
    <title>Acessos - Megabrain Services</title>
    <!-- Importa um arquivo CSS para estilizar a página; carrega/aponta para "./css/base.css". -->
    <link rel="stylesheet" href="./css/base.css">
    <!-- Importa um arquivo CSS para estilizar a página; carrega/aponta para "./css/usuarios.css". -->
    <link rel="stylesheet" href="./css/usuarios.css">
    <!-- Carrega JavaScript responsável pelo comportamento da tela; carrega/aponta para "./js/api.js". -->
    <script src="./js/api.js"></script>
    <!-- Carrega JavaScript responsável pelo comportamento da tela; carrega/aponta para "./js/utils.js". -->
    <script src="./js/utils.js"></script>
    <!-- Carrega JavaScript responsável pelo comportamento da tela; carrega/aponta para "./js/auth.js"; defer adia a execução até o HTML ser analisado. -->
    <script src="./js/auth.js" defer></script>
<!-- Encerra o elemento head iniciado anteriormente. -->
</head>
<!-- Contém todo o conteúdo visível da página. -->
<body>
    <!-- Cabeçalho do sistema com identidade e navegação. -->
    <header>
        <!-- Título de seção. -->
        <h2>Megabrain Services</h2>
        <!-- Agrupa os links de navegação entre páginas; class associa estilos CSS. -->
        <nav class="menu">
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "dashboard.html". -->
            <a href="dashboard.html">Painel</a>
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "cadastros.html". -->
            <a href="cadastros.html">Nova OS</a>
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "lista.html". -->
            <a href="lista.html">Ordens</a>
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "tecnicos.html". -->
            <a href="tecnicos.html">Tecnicos</a>
            <!-- Link que permite navegar para uma página ou destino; carrega/aponta para "clientes.html". -->
            <a href="clientes.html">Clientes</a>
        <!-- Encerra o elemento nav iniciado anteriormente. -->
        </nav>
    <!-- Encerra o elemento header iniciado anteriormente. -->
    </header>

    <!-- Marca a área principal da tela. -->
    <main>
        <!-- Agrupa elementos para organização e estilo; class associa estilos CSS. -->
        <div class="page-heading">
            <!-- Agrupa elementos para organização e estilo. -->
            <div>
                <!-- Parágrafo de texto explicativo; class associa estilos CSS. -->
                <p class="eyebrow">SEGURANÇA</p>
                <!-- Título principal desta tela. -->
                <h1>Gerenciar acessos</h1>
                <!-- Parágrafo de texto explicativo. -->
                <p>Crie contas e controle quem pode acessar o sistema.</p>
            <!-- Encerra o elemento div iniciado anteriormente. -->
            </div>
        <!-- Encerra o elemento div iniciado anteriormente. -->
        </div>

        <!-- Agrupa uma seção funcional do conteúdo; class associa estilos CSS. -->
        <section class="card">
            <!-- Título de seção. -->
            <h2>Nova conta</h2>
            <!-- Formulário que reúne campos e envia dados; id="form-usuario" identifica o elemento para o JavaScript e o CSS; class associa estilos CSS. -->
            <form id="form-usuario" class="form-grid">
                <!-- Rótulo que identifica o campo do formulário. -->
                <label for="nome">Nome completo</label>
                <!-- Campo de entrada de dados do usuário; id="nome" identifica o elemento para o JavaScript e o CSS; type="text" determina seu tipo; required exige preenchimento do campo. -->
                <input id="nome" type="text" placeholder="Nome da pessoa" required>

                <!-- Rótulo que identifica o campo do formulário. -->
                <label for="email">E-mail</label>
                <!-- Campo de entrada de dados do usuário; id="email" identifica o elemento para o JavaScript e o CSS; type="email" determina seu tipo; required exige preenchimento do campo. -->
                <input id="email" type="email" placeholder="nome@empresa.com" required>

                <!-- Rótulo que identifica o campo do formulário. -->
                <label for="senha">Senha</label>
                <!-- Agrupa elementos para organização e estilo; class associa estilos CSS. -->
                <div class="password-field">
                    <!-- Campo de entrada de dados do usuário; id="senha" identifica o elemento para o JavaScript e o CSS; type="password" determina seu tipo; required exige preenchimento do campo. -->
                    <input id="senha" type="password" placeholder="Mínimo de 12 caracteres" minlength="12" required>
                    <!-- Botão de ação ou envio de formulário; type="button" determina seu tipo; atributos aria-* ajudam tecnologias assistivas; class associa estilos CSS. -->
                    <button type="button" class="password-toggle" data-password-target="senha" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
                <!-- Encerra o elemento div iniciado anteriormente. -->
                </div>

                <!-- Rótulo que identifica o campo do formulário. -->
                <label for="papel">Perfil</label>
                <!-- Menu de opções para seleção; id="papel" identifica o elemento para o JavaScript e o CSS; required exige preenchimento do campo. -->
                <select id="papel" required>
                    <!-- Opção disponível dentro do campo de seleção. -->
                    <option value="admin">Administrador</option>
                    <!-- Opção disponível dentro do campo de seleção. -->
                    <option value="funcionario">Funcionário</option>
                    <!-- Opção disponível dentro do campo de seleção. -->
                    <option value="cliente">Cliente</option>
                <!-- Encerra o elemento select iniciado anteriormente. -->
                </select>

                <!-- Agrupa elementos para organização e estilo; id="bloco-cliente" identifica o elemento para o JavaScript e o CSS; hidden deixa o conteúdo inicialmente oculto. -->
                <div id="bloco-cliente" hidden>
                    <!-- Rótulo que identifica o campo do formulário. -->
                    <label for="cliente-id">Vincular ao cliente</label>
                    <!-- Menu de opções para seleção; id="cliente-id" identifica o elemento para o JavaScript e o CSS. -->
                    <select id="cliente-id"></select>
                <!-- Encerra o elemento div iniciado anteriormente. -->
                </div>

                <!-- Agrupa elementos para organização e estilo; id="bloco-tecnico" identifica o elemento para o JavaScript e o CSS; hidden deixa o conteúdo inicialmente oculto. -->
                <div id="bloco-tecnico" hidden>
                    <!-- Rótulo que identifica o campo do formulário. -->
                    <label for="tecnico-id">Vincular ao técnico (Opcional)</label>
                    <!-- Menu de opções para seleção; id="tecnico-id" identifica o elemento para o JavaScript e o CSS. -->
                    <select id="tecnico-id"></select>
                <!-- Encerra o elemento div iniciado anteriormente. -->
                </div>

                <!-- Botão de ação ou envio de formulário; id="btn-criar" identifica o elemento para o JavaScript e o CSS; type="submit" determina seu tipo. -->
                <button type="submit" id="btn-criar">Criar conta</button>
                <!-- Agrupa elementos para organização e estilo; id="mensagem-usuario" identifica o elemento para o JavaScript e o CSS; class associa estilos CSS. -->
                <div id="mensagem-usuario" class="mensagem" role="status"></div>
            <!-- Encerra o elemento form iniciado anteriormente. -->
            </form>
        <!-- Encerra o elemento section iniciado anteriormente. -->
        </section>

        <!-- NOVA SEÇÃO: LISTAGEM DE USUÁRIOS -->
        <!-- Agrupa uma seção funcional do conteúdo; class associa estilos CSS. -->
        <section class="data-section">
            <!-- Agrupa elementos para organização e estilo; class associa estilos CSS. -->
            <div class="section-heading">
                <!-- Agrupa elementos para organização e estilo. -->
                <div>
                    <!-- Título de seção. -->
                    <h2>Contas cadastradas</h2>
                    <!-- Parágrafo de texto explicativo; id="resultado-usuarios" identifica o elemento para o JavaScript e o CSS. -->
                    <p id="resultado-usuarios">Carregando...</p>
                <!-- Encerra o elemento div iniciado anteriormente. -->
                </div>
                <!-- Rótulo que identifica o campo do formulário; class associa estilos CSS. -->
                <label class="search-field">
                    <!-- Campo de entrada de dados do usuário; id="pesquisa-usuarios" identifica o elemento para o JavaScript e o CSS; type="search" determina seu tipo; atributos aria-* ajudam tecnologias assistivas. -->
                    <input id="pesquisa-usuarios" type="search" placeholder="Buscar nome ou e-mail" aria-label="Buscar usuários">
                <!-- Encerra o elemento label iniciado anteriormente. -->
                </label>
            <!-- Encerra o elemento div iniciado anteriormente. -->
            </div>
            <!-- Agrupa elementos para organização e estilo; class associa estilos CSS. -->
            <div class="table-wrap">
                <!-- Tabela de apresentação de registros. -->
                <table>
                    <!-- Cabeçalho da tabela. -->
                    <thead>
                        <!-- Linha da tabela. -->
                        <tr>
                            <!-- Célula de título de coluna. -->
                            <th>Nome</th>
                            <!-- Célula de título de coluna. -->
                            <th>E-mail</th>
                            <!-- Célula de título de coluna. -->
                            <th>Perfil</th>
                            <!-- Célula de título de coluna. -->
                            <th>Vínculo</th>
                            <!-- Célula de título de coluna. -->
                            <th>Status</th>
                            <!-- Célula de título de coluna. -->
                            <th>Ações</th>
                        <!-- Encerra o elemento tr iniciado anteriormente. -->
                        </tr>
                    <!-- Encerra o elemento thead iniciado anteriormente. -->
                    </thead>
                    <!-- Corpo com as linhas de dados da tabela; id="lista-usuarios" identifica o elemento para o JavaScript e o CSS. -->
                    <tbody id="lista-usuarios"></tbody>
                <!-- Encerra o elemento table iniciado anteriormente. -->
                </table>
            <!-- Encerra o elemento div iniciado anteriormente. -->
            </div>
            <!-- Agrupa elementos para organização e estilo; id="vazio-usuarios" identifica o elemento para o JavaScript e o CSS; hidden deixa o conteúdo inicialmente oculto; class associa estilos CSS. -->
            <div id="vazio-usuarios" class="empty-state" hidden>
                <!-- Texto enfatizado com maior importância. -->
                <strong>Nenhum usuário encontrado</strong>
                <!-- Trecho de texto usado para aplicar estilo/identificação. -->
                <span>Crie uma conta no formulário acima.</span>
            <!-- Encerra o elemento div iniciado anteriormente. -->
            </div>
        <!-- Encerra o elemento section iniciado anteriormente. -->
        </section>
    <!-- Encerra o elemento main iniciado anteriormente. -->
    </main>

    <!-- Carrega JavaScript responsável pelo comportamento da tela; carrega/aponta para "./js/usuarios.js". -->
    <script src="./js/usuarios.js"></script>
<!-- Encerra o elemento body iniciado anteriormente. -->
</body>
<!-- Encerra o elemento html iniciado anteriormente. -->
</html>
