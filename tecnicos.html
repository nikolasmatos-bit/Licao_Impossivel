<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnicos - OS System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="/js/auth.js" defer></script>
</head>
<body>

    <header>
        <h2>Ordem Clara</h2>
        <nav>
            <a href="dashboard.html"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span><span>Dashboard</span></a>
            <a href="cadastros.html"><span class="nav-icon"><i class="fa-solid fa-file-circle-plus"></i></span><span>Nova OS</span></a>
            <a href="lista.html"><span class="nav-icon"><i class="fa-solid fa-list-check"></i></span><span>Ordens</span></a>
            <a href="tecnicos.html" class="ativo"><span class="nav-icon"><i class="fa-solid fa-user-gear"></i></span><span>Técnicos</span></a>
            <a href="clientes.html"><span class="nav-icon"><i class="fa-solid fa-user"></i></span><span>Cliente</span></a>
        </nav>
    </header>

    <main>
        <div class="page-heading"><div><p class="eyebrow">EQUIPE</p><h1>Técnicos</h1><p>Organize especialidades e encontre rapidamente quem está disponível.</p></div></div>

        <section class="box">
            <form id="form-tecnico">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite o nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seunome@gmail.com" required>

                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="(11) 99999-9999" required>

                <label for="especialidade">Especialidade</label>
                <input type="text" id="especialidade" placeholder="Ex: Informática" required>

                <button type="submit">Salvar técnico</button>

                <div id="mensagem-tecnico" class="mensagem"></div>
            </form>
        </section>

        <section class="data-section">
            <div class="section-heading"><div><h2>Equipe cadastrada</h2><p id="resultado-tecnicos">Carregando equipe...</p></div><label class="search-field"><i class="fa-solid fa-magnifying-glass"></i><input id="pesquisa-tecnicos" type="search" placeholder="Buscar por nome ou especialidade" aria-label="Buscar técnicos"></label></div>
            <div class="table-wrap"><table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Especialidade</th>
                        <th>Telefone</th>
                    </tr>
                </thead>
                <tbody id="lista-tecnicos"></tbody>
            </table></div>
        </section>
    </main>

    <script>
        const form = document.getElementById('form-tecnico');
        const mensagem = document.getElementById('mensagem-tecnico');
        const tabela = document.getElementById('lista-tecnicos');
        const pesquisa = document.getElementById('pesquisa-tecnicos');
        let equipe = [];

        function mostrarMensagem(tipo, texto) {
            mensagem.className = 'mensagem ' + tipo;
            mensagem.textContent = texto;
        }

        function renderizarTecnicos() {
            const termo = pesquisa.value.trim().toLocaleLowerCase('pt-BR');
            const filtrados = equipe.filter(tecnico =>
                `${tecnico.nome} ${tecnico.email} ${tecnico.especialidade} ${tecnico.telefone}`.toLocaleLowerCase('pt-BR').includes(termo)
            );
            tabela.replaceChildren();
            filtrados.forEach(tecnico => {
                const linha = document.createElement('tr');
                [tecnico.nome, tecnico.email, tecnico.especialidade, tecnico.telefone].forEach(valor => {
                    const celula = document.createElement('td');
                    celula.textContent = valor;
                    linha.append(celula);
                });
                tabela.append(linha);
            });
            if (!filtrados.length) {
                const linha = document.createElement('tr');
                const celula = document.createElement('td');
                celula.colSpan = 4;
                celula.className = 'lista-vazia';
                celula.textContent = equipe.length ? 'Nenhum técnico corresponde à busca.' : 'Nenhum técnico cadastrado.';
                linha.append(celula);
                tabela.append(linha);
            }
            document.getElementById('resultado-tecnicos').textContent = `${filtrados.length} de ${equipe.length} técnicos`;
        }

        function carregarTecnicos() {
            fetch('/api/tecnicos/lista')
                .then(r => r.json())
                .then(tecnicos => {
                    equipe = tecnicos;
                    renderizarTecnicos();
                })
                .catch(() => {
                    tabela.innerHTML = '<tr><td colspan="4" class="lista-vazia">Erro ao carregar técnicos.</td></tr>';
                });
        }

        pesquisa.addEventListener('input', renderizarTecnicos);

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const tecnico = {
                nome: document.getElementById('nome').value.trim(),
                email: document.getElementById('email').value.trim().toLowerCase(),
                telefone: document.getElementById('telefone').value.trim(),
                especialidade: document.getElementById('especialidade').value.trim()
            };

            const numeros = tecnico.telefone.replace(/\D/g, '');
            if (numeros.length < 10 || numeros.length > 11) {
                mostrarMensagem('erro', 'Digite um telefone com 10 ou 11 números.');
                return;
            }

            fetch('/api/tecnicos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(tecnico)
            })
            .then(r => r.json())
            .then(dados => {
                if (dados.erro) {
                    mostrarMensagem('erro', dados.erro);
                    return;
                }
                form.reset();
                carregarTecnicos();
                mostrarMensagem('sucesso', 'Técnico cadastrado com sucesso!');
            })
            .catch(() => mostrarMensagem('erro', 'Servidor offline.'));
        });

        carregarTecnicos();
    </script>

</body>
</html>
