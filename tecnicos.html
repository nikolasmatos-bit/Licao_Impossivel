<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Técnicos - OS System</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>

        <h2>OS System</h2>

        <nav>
            <a href="dashboard.html"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span><span>Dashboard</span></a>
            <a href="cadastros.html"><span class="nav-icon"><i class="fa-solid fa-file-circle-plus"></i></span><span>Nova OS</span></a>
            <a href="lista.html"><span class="nav-icon"><i class="fa-solid fa-list-check"></i></span><span>Ordens</span></a>
            <a href="tecnicos.html" class="ativo"><span class="nav-icon"><i class="fa-solid fa-user-gear"></i></span><span>Técnicos</span></a>
            <a href="clientes.html"><span class="nav-icon"><i class="fa-solid fa-user"></i></span><span>Cliente</span></a>
        </nav>

    </header>


    <main>

        <h1>Cadastro de Técnicos</h1>

        <p>
            Cadastre e consulte os técnicos do sistema.
        </p>


        <section class="box">

            <form id="form-tecnico">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite o nome"
                    required
                >


                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seunome@gmail.com"
                    required
                >


                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="text"
                    id="telefone"
                    name="telefone"
                    placeholder="(11) 99999-9999"
                    required
                >


                <label for="especialidade">
                    Especialidade
                </label>

                <input
                    type="text"
                    id="especialidade"
                    name="especialidade"
                    placeholder="Ex: Informática"
                    required
                >


                <button type="submit">
                    Salvar técnico
                </button>

                <div id="mensagem-tecnico" class="mensagem" aria-live="polite"></div>

            </form>

        </section>


        <section class="box">

            <h2>Técnicos cadastrados</h2>

            <table>

                <thead>
                    <tr>

                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Especialidade</th>
                        <th>Telefone</th>

                    </tr>
                </thead>

                <tbody id="lista-tecnicos"></tbody>

            </table>

        </section>

    </main>

    <script>
        const authStatus = sessionStorage.getItem('osSystemAuth');
        if (authStatus !== 'true') {
            window.location.href = 'index.html';
        }

        const formTecnico = document.getElementById('form-tecnico');
        const mensagemTecnico = document.getElementById('mensagem-tecnico');
        const listaTecnicos = document.getElementById('lista-tecnicos');

        function escapeHtml(value = '') {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function safeParse(key, fallback) {
            try {
                const valor = JSON.parse(localStorage.getItem(key) || 'null');
                return valor ?? fallback;
            } catch (erro) {
                return fallback;
            }
        }

        function limparTexto(value) {
            return String(value || '').replace(/\s+/g, ' ').trim();
        }

        function mostrarMensagemTecnico(tipo, texto) {
            mensagemTecnico.className = `mensagem ${tipo}`;
            mensagemTecnico.textContent = texto;
        }

        function emailValido(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
        }

        function telefoneValido(telefone) {
            const numeros = telefone.replace(/\D/g, '');
            return numeros.length >= 10 && numeros.length <= 11;
        }

        function validarTecnico(dados) {
            const erros = [];

            if (dados.nome.length < 2) {
                erros.push('Digite um nome válido.');
            }

            if (!emailValido(dados.email)) {
                erros.push('Digite um e-mail válido, por exemplo: seunome@gmail.com');
            }

            if (!telefoneValido(dados.telefone)) {
                erros.push('Digite um telefone com 10 a 11 números, por exemplo: (11) 99999-9999');
            }

            if (dados.especialidade.length < 2) {
                erros.push('Informe a especialidade do técnico.');
            }

            return erros;
        }

        function renderTecnicos() {
            const tecnicos = safeParse('tecnicos', []);

            if (!tecnicos.length) {
                listaTecnicos.innerHTML = `
                    <tr>
                        <td colspan="4" class="lista-vazia">Nenhum técnico cadastrado.</td>
                    </tr>
                `;
                return;
            }

            listaTecnicos.innerHTML = tecnicos.map((tecnico) => `
                <tr>
                    <td>${escapeHtml(tecnico.nome)}</td>
                    <td>${escapeHtml(tecnico.email)}</td>
                    <td>${escapeHtml(tecnico.especialidade)}</td>
                    <td>${escapeHtml(tecnico.telefone)}</td>
                </tr>
            `).join('');
        }

        formTecnico.addEventListener('submit', function (event) {
            event.preventDefault();

            const dados = {
                nome: limparTexto(document.getElementById('nome').value),
                email: document.getElementById('email').value.trim().toLowerCase(),
                telefone: limparTexto(document.getElementById('telefone').value),
                especialidade: limparTexto(document.getElementById('especialidade').value)
            };

            const erros = validarTecnico(dados);

            if (erros.length > 0) {
                mostrarMensagemTecnico('erro', erros.join(' '));
                return;
            }

            const tecnicos = safeParse('tecnicos', []);
            const jaExiste = tecnicos.some((tecnico) => tecnico.email && tecnico.email.toLowerCase() === dados.email.toLowerCase());

            if (jaExiste) {
                mostrarMensagemTecnico('erro', 'Este e-mail já está cadastrado para outro técnico.');
                return;
            }

            tecnicos.push(dados);
            localStorage.setItem('tecnicos', JSON.stringify(tecnicos));

            formTecnico.reset();
            renderTecnicos();
            mostrarMensagemTecnico('sucesso', 'Técnico cadastrado com sucesso!');
        });

        renderTecnicos();
    </script>

</body>

</html>
