<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus serviços - OS System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <h2>OS System</h2>
        <nav>
            <a href="dashboard.html"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span><span>Painel</span></a>
            <a href="lista.html"><span class="nav-icon"><i class="fa-solid fa-list-check"></i></span><span>Meus serviços</span></a>
            <a href="clientes.html" class="ativo"><span class="nav-icon"><i class="fa-solid fa-user"></i></span><span>Meu perfil</span></a>
        </nav>
    </header>

    <main>
        <div class="topo">
            <div>
                <h1 id="titulo-cliente">Olá, João!</h1>
                <p>Veja como estão seus serviços.</p>
            </div>
        </div>

        <section class="cards">
            <div class="card">
                <h3>Total de serviços</h3>
                <strong>04</strong>
            </div>
            <div class="card">
                <h3>Em andamento</h3>
                <strong>02</strong>
            </div>
            <div class="card">
                <h3>Prontos</h3>
                <strong>02</strong>
            </div>
        </section>

        <section class="box">
            <h2>Meus serviços</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Aparelho</th>
                        <th>Situação</th>
                        <th>Ver</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#001</td>
                        <td>Notebook Dell</td>
                        <td><span class="status andamento">Em execução</span></td>
                        <td><a href="detalhes.html">Abrir</a></td>
                    </tr>
                    <tr>
                        <td>#003</td>
                        <td>Computador</td>
                        <td><span class="status concluida">Concluída</span></td>
                        <td><a href="detalhes.html">Abrir</a></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        // se não estiver logado volta pro login
        if (sessionStorage.getItem('osSystemAuth') !== 'true') {
            window.location.href = 'index.html';
        }

        // pega o nome do usuário pelo e-mail (parte antes do @)
        const email = sessionStorage.getItem('osSystemUser') || 'joão';
        const nome = email.split('@')[0];
        const nomeFormatado = nome.charAt(0).toUpperCase() + nome.slice(1);

        document.getElementById('titulo-cliente').textContent = 'Olá, ' + nomeFormatado + '!';
    </script>

</body>
</html>
