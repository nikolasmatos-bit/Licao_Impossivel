<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Megabrain Services</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/api.js"></script>

</head>
<body class="login">
    <main>
        <section class="auth-panel">
            <h1 id="auth-title">Entrar no sistema</h1>
            <p id="auth-description">Use o e-mail e a senha da sua conta.</p>

            <form id="form-login">
                <label for="email">E-mail de trabalho</label>
                <input type="email" id="email" name="email" autocomplete="username" placeholder="nome@empresa.com" required>
                <label for="senha">Senha</label>
                <div class="password-field"><input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Sua senha" required><button type="button" class="password-toggle" data-password-target="senha" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div>
                <button type="submit">Entrar</button>
                <div id="mensagem-login" class="mensagem" role="status"></div>
            </form>

            <form id="form-setup" hidden>
                <label for="admin-nome">Seu nome</label>
                <input type="text" id="admin-nome" autocomplete="name" placeholder="Nome de quem administra" required>
                <label for="admin-email">E-mail de administração</label>
                <input type="email" id="admin-email" autocomplete="email" placeholder="admin@empresa.com" required>
                <label for="admin-senha">Crie uma senha forte</label>
                <div class="password-field"><input type="password" id="admin-senha" autocomplete="new-password" minlength="12" placeholder="Mínimo de 12 caracteres" required><button type="button" class="password-toggle" data-password-target="admin-senha" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div>
                <button type="submit">Criar conta administradora</button>
                <div id="mensagem-setup" class="mensagem" role="status"></div>
            </form>

        </section>
    </main>

    <script>
        (() => {
        const loginForm = document.getElementById('form-login');
        const setupForm = document.getElementById('form-setup');

        function destinoDoPerfil(papel) {
            return papel === 'cliente' ? '/portal-cliente.html' : '/dashboard.html';
        }

        function mostrarMensagem(elemento, texto, tipo = 'erro') {
            elemento.className = `mensagem ${tipo}`;
            elemento.textContent = texto;
        }

        async function enviar(url, dados) {
            const resposta = await apiFetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const resultado = await resposta.json().catch(() => null);
            if (!resposta.ok) {
                throw new Error(resultado?.erro || `O servidor retornou HTTP ${resposta.status}. Abra o Megabrain pelo arquivo Abrir Ordem Clara.bat.`);
            }
            if (!resultado) throw new Error('O servidor respondeu em um formato inesperado. Abra o Megabrain pelo arquivo Abrir Ordem Clara.bat.');
            return resultado;
        }

        document.querySelectorAll('[data-password-target]').forEach(botao => {
            botao.addEventListener('click', () => {
                const campo = document.getElementById(botao.dataset.passwordTarget);
                const mostrar = campo.type === 'password';
                campo.type = mostrar ? 'text' : 'password';
                botao.setAttribute('aria-pressed', String(mostrar));
                botao.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
                botao.textContent = mostrar ? 'Ocultar' : 'Mostrar';
            });
        });

        loginForm.addEventListener('submit', async event => {
            event.preventDefault();
            const botao = loginForm.querySelector('button[type="submit"]');
            const mensagem = document.getElementById('mensagem-login');
            botao.disabled = true;
            try {
                const resultado = await enviar('/api/auth/login', {
                    email: document.getElementById('email').value,
                    senha: document.getElementById('senha').value
                });
                window.location.assign(destinoDoPerfil(resultado.usuario.papel));
            } catch (erro) {
                mostrarMensagem(mensagem, erro.message);
            } finally {
                botao.disabled = false;
            }
        });

        setupForm.addEventListener('submit', async event => {
            event.preventDefault();
            const botao = setupForm.querySelector('button[type="submit"]');
            const mensagem = document.getElementById('mensagem-setup');
            botao.disabled = true;
            try {
                await enviar('/api/auth/setup', {
                    nome: document.getElementById('admin-nome').value,
                    email: document.getElementById('admin-email').value,
                    senha: document.getElementById('admin-senha').value
                });
                window.location.assign('/dashboard.html');
            } catch (erro) {
                mostrarMensagem(mensagem, erro.message);
            } finally {
                botao.disabled = false;
            }
        });

        async function prepararTelaDeAcesso() {
            try {
                const sessaoResposta = await apiFetch('/api/auth/me');
                if (sessaoResposta.ok) {
                    const sessao = await sessaoResposta.json();
                    window.location.replace(destinoDoPerfil(sessao.usuario.papel));
                    return;
                }

                const resposta = await apiFetch('/api/auth/status');
                if (!resposta.ok) throw new Error('Não foi possível verificar a configuração do sistema.');
                const status = await resposta.json();
                if (status.configurado) return;
                loginForm.hidden = true;
                setupForm.hidden = false;
                document.getElementById('auth-title').textContent = 'Configure a administração';
                document.getElementById('auth-description').textContent = 'Crie a primeira conta administradora. Depois, gerencie os acessos da equipe pelo painel.';
            } catch (erro) {
                console.error('Não foi possível preparar a tela de acesso:', erro);
                mostrarMensagem(document.getElementById('mensagem-login'), 'Não foi possível conectar ao servidor. Feche e abra o Megabrain Services novamente.');
            }
        }

        prepararTelaDeAcesso();
        })();
    </script>

</body>
</html>
