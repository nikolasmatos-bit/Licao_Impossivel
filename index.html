<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - OS System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="login">

    <div class="login-box">
        <h1>OS System</h1>
        <p>Controle de serviços</p>

        <form id="form-login">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha" required>

            <button type="submit" class="botao">Entrar</button>

            <div id="mensagem-login" class="mensagem"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('form-login');
        const mensagem = document.getElementById('mensagem-login');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            if (senha.length < 4) {
                mensagem.className = 'mensagem erro';
                mensagem.textContent = 'A senha precisa ter pelo menos 4 caracteres.';
                return;
            }

            // guarda o login na sessão
            sessionStorage.setItem('osSystemAuth', 'true');
            sessionStorage.setItem('osSystemUser', email.toLowerCase());
            window.location.href = 'dashboard.html';
        });
    </script>

</body>
</html>
