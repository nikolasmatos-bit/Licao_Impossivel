<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo serviço - OS System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <h2>OS System</h2>
        <nav>
            <a href="dashboard.html"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span><span>Painel</span></a>
            <a href="cadastros.html" class="ativo"><span class="nav-icon"><i class="fa-solid fa-file-circle-plus"></i></span><span>Novo serviço</span></a>
            <a href="lista.html"><span class="nav-icon"><i class="fa-solid fa-list-check"></i></span><span>Serviços</span></a>
            <a href="tecnicos.html"><span class="nav-icon"><i class="fa-solid fa-user-gear"></i></span><span>Técnicos</span></a>
            <a href="clientes.html"><span class="nav-icon"><i class="fa-solid fa-user"></i></span><span>Clientes</span></a>
        </nav>
    </header>

    <main>
        <h1>Novo serviço</h1>
        <p>Preencha os dados do serviço.</p>

        <section class="box">
            <form id="form-os" class="form-grid">

                <label for="cliente">Quem é o cliente?</label>
                <input type="text" id="cliente" placeholder="Nome do cliente" required>

                <label for="equipamento">Qual é o aparelho?</label>
                <input type="text" id="equipamento" placeholder="Ex: Notebook" required>

                <label for="tecnico">Quem vai fazer o serviço?</label>
                <input type="text" id="tecnico" list="lista-tecnicos" placeholder="Nome do técnico" required>
                <datalist id="lista-tecnicos"></datalist>

                <label for="prioridade">Qual é a urgência?</label>
                <select id="prioridade">
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                </select>

                <label for="descricao">O que aconteceu?</label>
                <textarea id="descricao" placeholder="Conte o problema" required></textarea>

                <button type="button" id="buscar-solucao" class="botao-secundario">Buscar ajuda na internet</button>
                <button type="submit" class="botao-primary">Salvar</button>

                <div id="mensagem-os" class="mensagem"></div>
            </form>
        </section>
    </main>

    <script>
        // se não estiver logado volta pro login
        if (sessionStorage.getItem('osSystemAuth') !== 'true') {
            window.location.href = 'index.html';
        }

        const form = document.getElementById('form-os');
        const mensagem = document.getElementById('mensagem-os');

        function mostrarMensagem(tipo, texto) {
            mensagem.className = 'mensagem ' + tipo;
            mensagem.textContent = texto;
        }

        // coloca os técnicos na lista de sugestões
        function carregarTecnicos() {
            let tecnicos = JSON.parse(localStorage.getItem('tecnicos')) || [];

            // se não tiver nenhum, cria dois de exemplo
            if (tecnicos.length === 0) {
                tecnicos = [
                    { nome: 'Marcos Ribeiro', email: 'marcos.ribeiro@os.com', telefone: '(11) 95555-4444', especialidade: 'Suporte Técnico' },
                    { nome: 'Ana Souza', email: 'ana.souza@os.com', telefone: '(11) 94444-5555', especialidade: 'Manutenção' }
                ];
                localStorage.setItem('tecnicos', JSON.stringify(tecnicos));
            }

            let opcoes = '';
            for (let i = 0; i < tecnicos.length; i++) {
                opcoes += '<option value="' + tecnicos[i].nome + '"></option>';
            }
            document.getElementById('lista-tecnicos').innerHTML = opcoes;
        }

        // abre o google pesquisando a descrição do problema
        document.getElementById('buscar-solucao').addEventListener('click', function () {
            const descricao = document.getElementById('descricao').value.trim();

            if (descricao === '') {
                mostrarMensagem('erro', 'Digite o problema antes de buscar.');
                return;
            }

            window.open('https://www.google.com/search?q=' + encodeURIComponent(descricao), '_blank');
        });

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const descricao = document.getElementById('descricao').value.trim();

            if (descricao.length < 10) {
                mostrarMensagem('erro', 'Conte o problema com pelo menos 10 caracteres.');
                return;
            }

            const ordens = JSON.parse(localStorage.getItem('ordens')) || [];

            const novaOrdem = {
                id: ordens.length + 1,
                cliente: document.getElementById('cliente').value.trim(),
                equipamento: document.getElementById('equipamento').value.trim(),
                tecnico: document.getElementById('tecnico').value.trim(),
                prioridade: document.getElementById('prioridade').value,
                descricao: descricao,
                status: 'Aberta',
                data: new Date().toLocaleDateString('pt-BR')
            };

            ordens.push(novaOrdem);
            localStorage.setItem('ordens', JSON.stringify(ordens));

            mostrarMensagem('sucesso', 'Serviço salvo com sucesso!');

            setTimeout(function () {
                window.location.href = 'lista.html';
            }, 800);
        });

        carregarTecnicos();
    </script>

</body>
</html>
