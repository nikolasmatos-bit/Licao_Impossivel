<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo serviço - Megabrain Services</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/api.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/auth.js" defer></script>
</head>
<body>

        <header>
        <h2>Megabrain Services</h2>
        <nav class="menu">
            <a href="dashboard.html">Painel</a>
            <a href="cadastros.html">Nova OS</a>
            <a href="lista.html">Ordens</a>
            <a href="tecnicos.html">Tecnicos</a>
            <a href="clientes.html">Clientes</a>
        </nav>
    </header>

    <main>
        <h1>Novo serviço</h1>
        <p>Preencha os dados do serviço.</p>

        <section class="box">
            <form id="form-os" class="form-grid">

                <label for="cliente-id">Cliente cadastrado</label>
                <select id="cliente-id"><option value="">Novo cliente</option></select>

                <label for="cliente">Quem é o cliente?</label>
                <input type="text" id="cliente" placeholder="Nome do cliente" required>

                <label for="cliente-telefone">Telefone / WhatsApp do cliente</label>
                <input type="tel" id="cliente-telefone" placeholder="(11) 99999-9999" autocomplete="tel">

                <label for="cliente-email">E-mail do cliente</label>
                <input type="email" id="cliente-email" placeholder="cliente@email.com" autocomplete="email">

                <label for="equipamento">Qual é o aparelho?</label>
                <input type="text" id="equipamento" placeholder="Ex: Notebook" required>

                <label for="tecnico">Quem vai fazer o serviço?</label>
                <select id="tecnico"><option value="">A definir</option></select>

                <label for="prioridade">Qual é a urgência?</label>
                <select id="prioridade">
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                </select>

                <label for="descricao">O que aconteceu?</label>
                <textarea id="descricao" placeholder="Conte o problema" required></textarea>

                <button type="button" id="buscar-solucao" class="botao-secundario">Buscar ajuda na internet</button>
                <button type="submit" class="botao-primary">Salvar</button>

                <div id="mensagem-os" class="mensagem"></div>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById('form-os');
        const mensagem = document.getElementById('mensagem-os');
        const clienteSelect = document.getElementById('cliente-id');
        const camposCliente = ['cliente', 'cliente-telefone', 'cliente-email'].map(id => document.getElementById(id));
        let clientes = [];

        function mostrarMensagem(tipo, texto) {
            mensagem.className = 'mensagem ' + tipo;
            mensagem.textContent = texto;
        }

        clienteSelect.addEventListener('change', () => {
            const cliente = clientes.find(item => item.id === Number(clienteSelect.value));
            const valores = cliente ? [cliente.nome, cliente.telefone, cliente.email] : ['', '', ''];
            camposCliente.forEach((campo, indice) => {
                campo.value = valores[indice] || '';
                campo.readOnly = Boolean(cliente);
            });
        });

        apiFetch('/api/clientes')
            .then(async resposta => {
                if (!resposta.ok) throw new Error('Não foi possível carregar os clientes.');
                return resposta.json();
            })
            .then(dados => {
                clientes = dados;
                dados.forEach(cliente => {
                    const opcao = document.createElement('option');
                    opcao.value = cliente.id;
                    opcao.textContent = `${cliente.nome} — ${cliente.email || 'Sem e-mail'} (#${cliente.id})`;
                    clienteSelect.append(opcao);
                });
            })
            .catch(erro => mostrarMensagem('erro', erro.message));

        // O identificador distingue técnicos que tenham o mesmo nome.
        apiFetch('/api/tecnicos')
            .then(async resposta => {
                if (!resposta.ok) throw new Error('Não foi possível carregar os técnicos.');
                return resposta.json();
            })
            .then(tecnicos => {
                const lista = document.getElementById('tecnico');
                tecnicos.forEach(t => {
                    const opcao = document.createElement('option');
                    opcao.value = t.id;
                    opcao.textContent = `${t.nome} (#${t.id})`;
                    lista.append(opcao);
                });
            })
            .catch(erro => mostrarMensagem('erro', erro.message));

        // Buscar no Google
        document.getElementById('buscar-solucao').addEventListener('click', function () {
            const descricao = document.getElementById('descricao').value.trim();
            if (descricao === '') {
                mostrarMensagem('erro', 'Digite o problema antes de buscar.');
                return;
            }
            window.open('https://www.google.com/search?q=' + encodeURIComponent(descricao), '_blank');
        });

        // Salvar OS no banco
        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const descricao = document.getElementById('descricao').value.trim();
            if (descricao.length < 10) {
                mostrarMensagem('erro', 'Conte o problema com pelo menos 10 caracteres.');
                return;
            }

            const novaOrdem = {
                cliente_id: clienteSelect.value ? Number(clienteSelect.value) : null,
                cliente_nome: document.getElementById('cliente').value.trim(),
                cliente_telefone: document.getElementById('cliente-telefone').value.trim(),
                cliente_email: document.getElementById('cliente-email').value.trim(),
                equipamento: document.getElementById('equipamento').value.trim(),
                tecnico_id: document.getElementById('tecnico').value ? Number(document.getElementById('tecnico').value) : null,
                prioridade: document.getElementById('prioridade').value,
                descricao: descricao
            };

            if (!novaOrdem.cliente_id && novaOrdem.cliente_telefone && !Utils.numeroWhatsApp(novaOrdem.cliente_telefone)) {
                mostrarMensagem('erro', 'Digite um telefone válido com DDD.');
                return;
            }

            apiFetch('/api/ordens', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novaOrdem)
            })
            .then(r => r.json())
            .then(dados => {
                if (dados.erro) {
                    mostrarMensagem('erro', 'Erro: ' + dados.erro);
                    return;
                }
                mostrarMensagem('sucesso', 'Serviço salvo no banco de dados!');
                setTimeout(() => { window.location.href = 'lista.html'; }, 800);
            })
            .catch(() => mostrarMensagem('erro', 'Servidor offline. O Node está rodando?'));
        });
    </script>

</body>
</html>
